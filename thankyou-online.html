<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - Online Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f1efef;
      margin: 0;
      padding: 20px;
    }
    .home-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #f6f5f4;
      color: rgb(16, 15, 15);
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .home-btn:hover {
      background: #e04a2b;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: rgb(231, 226, 226);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: left;
    }
    h2 {
      color: #2d8a40;
      text-align: center;
    }
    .bill {
      border: 2px dashed #333;
      padding: 15px;
      margin-top: 15px;
    }
    .bill p {
      margin: 8px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button class="home-btn" onclick="window.location.href='landing.html'">🏠 Home</button>

  <h2>✅ Payment Successful!</h2>

  <div class="container">
    <h3>🧾 Payment Receipt</h3>
    <div class="bill">
      <p><strong>Name:</strong> <span id="userName">Guest</span></p>
      <p><strong>Date:</strong> <span id="bookingDate">--</span></p>
      <p><strong>Meal:</strong> <span id="mealName">N/A</span></p>
      <p><strong>Transaction ID:</strong> <span id="txnId">N/A</span></p>
      <p><strong>Amount Paid:</strong> ₹<span id="amountPaid">0</span></p>
    </div>
  </div>

  <script>
    const bookings = JSON.parse(localStorage.getItem("onlineBookings") || "[]");
    const latest = bookings[bookings.length - 1];

    if (latest) {
      const meal = latest.meal || "";
      let amount = 0;

      if (meal.toLowerCase() === "breakfast" || meal.toLowerCase() === "dinner") {
        amount = 50;
      } else if (meal.toLowerCase() === "lunch") {
        amount = 70;
      }

      // Update fields
      document.getElementById("userName").innerText = latest.name || "Guest";
      document.getElementById("txnId").innerText = latest.transactionId || latest.txnId || "N/A";
      document.getElementById("mealName").innerText = `${meal} - ${latest.selectedMeal || ""}`;
      document.getElementById("amountPaid").innerText = amount;
      document.getElementById("bookingDate").innerText = latest.date || "--";

      // Update amount in localStorage for consistency
      latest.amount = amount;
      bookings[bookings.length - 1] = latest;
      localStorage.setItem("onlineBookings", JSON.stringify(bookings));
    }
  </script>
</body>
</html>
