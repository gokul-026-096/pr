<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }
    .payment-container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    button {
      background: #008CBA;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background: #005f73;
    }
    .qr-code {
      margin-top: 20px;
    }
    input {
      padding: 8px;
      width: 80%;
      margin-top: 10px;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <h2>Complete Your Payment</h2>
    <p><strong>Date:</strong> <span id="bookingDate">Loading...</span></p>
    <p><strong>Meal:</strong> <span id="mealName">Loading...</span></p>
    <p><strong>Amount:</strong> ₹<span id="mealPrice">0</span></p>

    <div class="qr-code">
      <h3>Scan & Pay via Google Pay / UPI</h3>
      <img id="qrImage" src="" alt="QR Code will appear here" width="200" class="hidden" />
      <p id="upiDetails">UPI ID: yourupi@okicici</p>
      <input type="number" id="qrAmount" readonly />
      <button id="confirmQRPayment" disabled>Confirm QR Payment</button>
    </div>
  </div>

  <script>
    // Retrieve data from sessionStorage
    const meal = sessionStorage.getItem("meal");
    const selectedMeal = sessionStorage.getItem("selectedMeal") || "Standard";
    const bookingDate = sessionStorage.getItem("bookingDate") || new Date().toISOString().split("T")[0];
    const amount = sessionStorage.getItem("amount") || 0;

    const mealNameElement = document.getElementById("mealName");
    const mealPriceElement = document.getElementById("mealPrice");
    const qrAmountElement = document.getElementById("qrAmount");
    const qrImageElement = document.getElementById("qrImage");
    const confirmQRButton = document.getElementById("confirmQRPayment");
    const bookingDateElement = document.getElementById("bookingDate");

    if (!meal || !amount) {
      alert("Missing meal details. Please go back and book again.");
    }

    // Display content
    mealNameElement.innerText = `${meal} - ${selectedMeal}`;
    mealPriceElement.innerText = amount;
    qrAmountElement.value = amount;
    bookingDateElement.innerText = bookingDate;

    // Show QR image based on amount
    if (parseInt(amount) === 70) {
      qrImageElement.src = "qr2.jpeg";
    } else {
      qrImageElement.src = "qr1.jpeg";
    }
    qrImageElement.classList.remove("hidden");
    confirmQRButton.disabled = false;

    // Confirm QR Payment
    confirmQRButton.addEventListener("click", () => {
      sessionStorage.setItem("paymentConfirmed", "true");
      window.location.href = "info.html";
    });
  </script>
</body>
</html>
